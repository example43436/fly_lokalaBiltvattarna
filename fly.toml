# fly.toml — SparkWash deployment config
# Run `fly launch` once to create the app, then `fly deploy` for updates.

app = "sparkwash"          # change to your actual app name after `fly launch`
primary_region = "arn"     # Stockholm — closest to Malmö

[build]
  # No Dockerfile needed; Fly auto-detects Python via requirements.txt + Procfile

[env]
  PORT = "8080"
  APP_DATA_DIR = "/data"   # points to the persistent volume below

# Persistent volume — your SQLite db and CSV live here and survive redeploys
[[mounts]]
  source      = "sparkwash_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout  = "5s"
  grace_period = "10s"
  method = "GET"
  path   = "/"
