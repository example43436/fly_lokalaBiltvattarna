# fly.toml app configuration file generated for fly-lokalabiltvattarna on 2026-05-03T15:28:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fly-lokalabiltvattarna'
primary_region = 'ams'

[build]

[env]
  APP_DATA_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'sparkwash_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
